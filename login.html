<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your NuraHub account.">
  <title>Login | NuraHub Auth System</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS & Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Styling -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-shield-lock-fill text-primary"></i>
        <span>NuraHub Auth</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <span class="small text-muted d-none d-sm-inline">Don't have an account?</span>
        <a href="register.html" class="btn btn-outline-primary btn-sm px-3">Register</a>
      </div>
    </div>
  </nav>

  <!-- Login Form Section -->
  <main class="d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
          
          <div class="auth-card p-4 p-md-5">
            <div class="auth-header">
              <h1>Welcome Back</h1>
              <p>Sign in with your email and password to access your dashboard</p>
            </div>

            <!-- Global Alert Container -->
            <div id="alertContainer" class="d-none"></div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>
              <!-- Hidden CSRF Token -->
              <input type="hidden" name="csrf_token" id="csrfToken" value="">

              <!-- Email Field -->
              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                  <input 
                    type="email" 
                    class="form-control" 
                    id="email" 
                    name="email" 
                    placeholder="name@example.com" 
                    autocomplete="email"
                    required
                  >
                </div>
                <div class="invalid-feedback" id="emailFeedback"></div>
              </div>

              <!-- Password Field -->
              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                  <input 
                    type="password" 
                    class="form-control" 
                    id="password" 
                    name="password" 
                    placeholder="Enter your password" 
                    autocomplete="current-password"
                    required
                  >
                  <button class="btn btn-outline-secondary toggle-password" type="button" data-target="#password">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
                <div class="invalid-feedback" id="passwordFeedback"></div>
              </div>

              <!-- Submit Button -->
              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary" id="submitBtn">
                  <span class="spinner-border spinner-border-sm me-2 d-none" id="btnSpinner" role="status" aria-hidden="true"></span>
                  <span id="btnText">Sign In</span>
                </button>
              </div>

              <!-- Link to Register -->
              <div class="text-center">
                <p class="small text-muted mb-0">
                  New to NuraHub? <a href="register.html" class="text-primary fw-semibold text-decoration-none">Create an account</a>
                </p>
              </div>

            </form>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Application Footer -->
  <footer class="text-center">
    <div class="container">
      <p class="mb-0">&copy; 2026 NuraHub Auth System. All rights reserved.</p>
    </div>
  </footer>

  <!-- Scripts: jQuery, Bootstrap Bundle, Custom Login Logic -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
